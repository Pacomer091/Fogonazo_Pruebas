<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Comandas — La Fogoneta Smash Burgers</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --brand-orange: #ff5500;
      --brand-orange-light: #ff7a00;
      --brand-gradient: linear-gradient(135deg, #ff5500 0%, #ff7a00 100%);
    }

    body {
      background: #f8fafc;
      color: var(--text-main);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
    }

    .control-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .restaurant-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .restaurant-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .restaurant-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-main);
      margin: 0;
    }

    .role-badge {
      font-size: 0.72rem;
      font-weight: 800;
      color: #ea580c;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .control-container {
      max-width: 1200px;
      margin: 2rem auto 4rem;
      padding: 0 1.25rem;
    }

    .control-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 0;
      color: var(--text-main);
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #059669;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    .order-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .order-card.status-recibido {
      border-left: 4px solid #3b82f6;
    }

    .order-card.status-cocina {
      border-left: 4px solid #ff5500;
    }

    .order-card.status-listo {
      border-left: 4px solid #10b981;
    }

    .order-card.status-entregado {
      border-left: 4px solid #64748b;
      opacity: 0.7;
    }

    .order-card.status-cancelado {
      border-left: 4px solid #ef4444;
      opacity: 0.6;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 8px;
    }

    .order-num {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .service-badge {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .service-delivery {
      background: #ffedd5;
      color: #ea580c;
    }

    .service-recogida {
      background: #e0f2fe;
      color: #0284c7;
    }

    .client-details {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .client-name {
      font-weight: 800;
      color: var(--text-main);
    }

    .client-phone {
      color: var(--text-muted);
    }

    .client-address {
      color: #b45309;
      font-weight: 600;
      margin-top: 3px;
    }

    .client-notes {
      color: #0369a1;
      font-style: italic;
      margin-top: 3px;
    }

    .order-items-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .item-qty-name {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .item-qty {
      font-weight: 900;
      color: var(--brand-orange);
      background: #fff7ed;
      padding: 0 5px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .item-extras-list {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
      padding-left: 24px;
    }

    .order-total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .order-actions-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .btn-status {
      padding: 7px 6px;
      font-size: 0.76rem;
      font-weight: 800;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn-status:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    .btn-status.active-recibido {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    .btn-status.active-cocina {
      background: #ffedd5;
      border-color: #ff5500;
      color: #c2410c;
    }

    .btn-status.active-listo {
      background: #dcfce7;
      border-color: #10b981;
      color: #15803d;
    }

    .btn-status.active-entregado {
      background: #f1f5f9;
      border-color: #64748b;
      color: #334155;
    }

    .btn-status.btn-cancel {
      grid-column: span 3;
      color: #dc2626;
      border-color: #fca5a5;
      background: #fff5f5;
    }

    .btn-status.btn-cancel:hover {
      background: #fee2e2;
    }

    .empty-orders {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .tracking-link-btn {
      font-size: 0.75rem;
      color: var(--brand-orange);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .tracking-link-btn:hover {
      text-decoration: underline;
    }

    .btn-delete-order {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #dc2626;
      background: #fff5f5;
      border: 1px solid #fecaca;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .btn-delete-order:hover {
      background: #fee2e2;
      border-color: #f87171;
    }

    .btn-delete-order:active {
      transform: scale(0.96);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.SUPABASE_CONFIG = {
      url: 'https://bmikdaufucnrezcbssab.supabase.co',
      key: 'sb_publishable__Jw9hiEizMUSztT-NG559w_ACP1aMrr'
    };
    try {
      window.supabaseClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.key);
    } catch (e) {
      console.warn('Supabase init notice:', e);
    }
  </script>
</head>
<body>

  <header class="control-header">
    <div class="header-inner">
      <div class="restaurant-brand">
        <a href="demo.html" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
          <img src="img/logo.png" alt="Fogonazo" class="restaurant-logo">
          <h1 class="restaurant-title">La Fogoneta Smash Burgers</h1>
        </a>
        <span class="role-badge">Panel de Control Rápido</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="live-status-pill">
          <span class="pulse-dot"></span>
          Conexión en vivo
        </span>
        <a href="demo.html" target="_blank" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:6px;">
          <span>Ver Carta Cliente</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="control-container">
    <div class="control-top-bar">
      <div>
        <h2 class="page-title">Gestión de Comandas</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin: 3px 0 0 0;">
          Cambia el estado de una comanda o elimínala. La pantalla de seguimiento del cliente se actualizará en tiempo real.
        </p>
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button onclick="loadOrders()" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Refrescar</span>
        </button>
        <button onclick="confirmClearCompleted()" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Limpiar entregadas</span>
        </button>
        <button onclick="confirmClearAll()" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:6px; color:#dc2626; border-color:#fca5a5; background:#fff5f5;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span>Borrar todas</span>
        </button>
      </div>
    </div>

    <div class="orders-grid" id="orders-container">
      <div class="empty-orders">Cargando comandas en vivo...</div>
    </div>
  </main>

  <div id="toast-container"></div>

  
  <script>
    const REST_ID = "rest_demo";
    let ordersList = [];

    // Comandas demo iniciales si no hay nada guardado
    const INITIAL_DEMO_ORDERS = [
      {
        id: 'ord_demo_sample_1',
        restaurante_id: REST_ID,
        numero_comanda: 108,
        tracking_token: 'trk_demo_sample_1',
        tipo_servicio: 'delivery',
        cliente_nombre: 'Laura Gómez',
        cliente_telefono: '612 345 678',
        direccion_entrega: 'Calle Serrano 42, 2º A',
        notas_cliente: 'Timbre roto, llamar al móvil al llegar por favor',
        subtotal_cents: 2240,
        gastos_envio_cents: 250,
        total_cents: 2490,
        subtotal_formatted: '22,40 €',
        gastos_envio_formatted: '2,50 €',
        total_formatted: '24,90 €',
        metodo_pago: 'bizum',
        estado: 'cocina',
        created_at: new Date(Date.now() - 8 * 60000).toISOString(),
        lineas: [
          {
            id: 'lin_demo_1',
            nombre_producto: 'Smash Trufada Doble',
            cantidad: 1,
            total_linea_cents: 1190,
            extras: [{ opcion_nombre: 'Al punto con costra crujiente' }]
          },
          {
            id: 'lin_demo_2',
            nombre_producto: 'Smash Bacon Cheese Clásica',
            cantidad: 1,
            total_linea_cents: 1050,
            extras: [{ opcion_nombre: 'Bien hecha' }]
          }
        ]
      },
      {
        id: 'ord_demo_sample_2',
        restaurante_id: REST_ID,
        numero_comanda: 107,
        tracking_token: 'trk_demo_sample_2',
        tipo_servicio: 'takeaway',
        cliente_nombre: 'Marcos Alonso',
        cliente_telefono: '699 888 777',
        direccion_entrega: null,
        notas_cliente: 'Recogida rápida en barra',
        subtotal_cents: 1540,
        gastos_envio_cents: 0,
        total_cents: 1540,
        subtotal_formatted: '15,40 €',
        gastos_envio_formatted: '0,00 €',
        total_formatted: '15,40 €',
        metodo_pago: 'tarjeta',
        estado: 'recibido',
        created_at: new Date(Date.now() - 20 * 60000).toISOString(),
        lineas: [
          {
            id: 'lin_demo_3',
            nombre_producto: 'Smash Pollo Sureño Crujiente',
            cantidad: 1,
            total_linea_cents: 990,
            extras: []
          },
          {
            id: 'lin_demo_4',
            nombre_producto: 'Patatas Rústicas Trufadas',
            cantidad: 1,
            total_linea_cents: 550,
            extras: []
          }
        ]
      }
    ];

    async function loadOrders() {
      const isStatic = window.location.protocol === 'file:' || 
                       window.location.hostname.endsWith('github.io') || 
                       window.location.pathname.endsWith('.html');

      if (isStatic || !window.location.port) {
        // 1. Cargar desde Supabase si está disponible
        let supaOrders = [];
        if (window.supabaseClient) {
          try {
            const { data, error } = await window.supabaseClient
              .from('pedidos')
              .select('*, lineas_de_pedido(*)')
              .eq('restaurante_id', REST_ID)
              .order('created_at', { ascending: false });
            if (!error && data && data.length > 0) {
              supaOrders = data.map(o => ({
                ...o,
                subtotal_formatted: ((o.subtotal_cents || 0) / 100).toFixed(2).replace('.', ',') + ' €',
                gastos_envio_formatted: ((o.gastos_envio_cents || 0) / 100).toFixed(2).replace('.', ',') + ' €',
                total_formatted: ((o.total_cents || 0) / 100).toFixed(2).replace('.', ',') + ' €',
                lineas: (o.lineas_de_pedido || []).map(l => ({
                  ...l,
                  extras: Array.isArray(l.extras_json) ? l.extras_json : (typeof l.extras_json === 'string' ? JSON.parse(l.extras_json) : [])
                }))
              }));
            }
          } catch (e) {
            console.warn('Supabase load orders:', e);
          }
        }

        // 2. Cargar desde localStorage
        let localOrders = [];
        try {
          const stored = localStorage.getItem('fogon_orders');
          if (stored) {
            localOrders = JSON.parse(stored);
          } else {
            localOrders = INITIAL_DEMO_ORDERS;
            localStorage.setItem('fogon_orders', JSON.stringify(localOrders));
          }
        } catch (_) {
          localOrders = INITIAL_DEMO_ORDERS;
        }

        // Fusión de Supabase + localStorage
        const map = new Map();
        supaOrders.forEach(o => map.set(o.id, o));
        localOrders.forEach(o => {
          if (!map.has(o.id)) map.set(o.id, o);
        });

        ordersList = Array.from(map.values()).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        renderOrders();
        return;
      }

      // Backend Node.js
      try {
        const res = await fetch('/api/admin/orders');
        if (!res.ok) throw new Error('Error al cargar comandas');
        ordersList = await res.json();
        renderOrders();
      } catch (err) {
        console.error(err);
      }
    }

    function renderOrders() {
      const container = document.getElementById('orders-container');
      if (!container) return;

      if (!ordersList || ordersList.length === 0) {
        container.innerHTML = `
          <div class="empty-orders">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" style="margin-bottom:8px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
            <p style="font-weight:700; color:var(--text-main); margin:0;">No hay comandas activas</p>
            <span style="font-size:0.82rem;">Los nuevos pedidos de tus clientes aparecerán aquí automáticamente.</span>
          </div>
        `;
        return;
      }

      container.innerHTML = ordersList.map(order => {
        const estado = order.estado || 'recibido';
        const serviceLabel = order.tipo_servicio === 'delivery' ? 'Domicilio' : 'Recogida';
        const serviceClass = order.tipo_servicio === 'delivery' ? 'service-delivery' : 'service-recogida';

        const linesHtml = (order.lineas || []).map(line => {
          const extrasText = (line.extras || []).map(e => e.opcion_nombre).join(', ');
          return `
            <li class="order-item-row">
              <div>
                <div class="item-qty-name">
                  <span class="item-qty">${line.cantidad}x</span>
                  <span><strong>${line.nombre_producto}</strong></span>
                </div>
                ${extrasText ? `<div class="item-extras-list">+ ${extrasText}</div>` : ''}
              </div>
              <span style="font-weight:700; font-size:0.82rem;">${((line.total_linea_cents || 0) / 100).toFixed(2).replace('.', ',')} €</span>
            </li>
          `;
        }).join('');

        const isStatic = window.location.pathname.endsWith('.html') || window.location.hostname.includes('github.io');
        const trackingHref = isStatic ? `seguimiento.html?token=${order.tracking_token}` : `/pedido/${order.tracking_token}`;

        return `
          <div class="order-card status-${estado}" id="card-${order.id}">
            <div class="order-card-header">
              <div>
                <span class="order-num">#${order.numero_comanda}</span>
                <span style="font-size:0.75rem; color:var(--text-muted); margin-left:6px;">${new Date(order.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="service-badge ${serviceClass}">${serviceLabel}</span>
                <button onclick="confirmDeleteOrder('${order.id}', '${order.numero_comanda}')" class="btn-delete-order" title="Borrar comanda #${order.numero_comanda}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                  <span>Borrar</span>
                </button>
              </div>
            </div>

            <div class="client-details">
              <div class="client-name">${order.cliente_nombre} • <span class="client-phone">${order.cliente_telefono}</span></div>
              ${order.direccion_entrega ? `<div class="client-address">Entrega: ${order.direccion_entrega}</div>` : ''}
              ${order.notas_cliente ? `<div class="client-notes">Nota: "${order.notas_cliente}"</div>` : ''}
            </div>

            <ul class="order-items-list">
              ${linesHtml}
            </ul>

            <div class="order-total-bar">
              <span style="color:var(--text-muted); font-size:0.82rem;">Total comanda</span>
              <span style="color:var(--brand-orange); font-size:1.1rem;">${order.total_formatted || ((order.total_cents||0)/100).toFixed(2).replace('.', ',') + ' €'}</span>
            </div>

            <div>
              <a href="${trackingHref}" target="_blank" class="tracking-link-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span>Ver pantalla de seguimiento del cliente</span>
              </a>
            </div>

            <div class="order-actions-bar">
              <button onclick="setOrderStatus('${order.id}', 'recibido')" class="btn-status ${estado === 'recibido' ? 'active-recibido' : ''}">
                <span>Recibido</span>
              </button>
              <button onclick="setOrderStatus('${order.id}', 'cocina')" class="btn-status ${estado === 'cocina' ? 'active-cocina' : ''}">
                <span>En Cocina</span>
              </button>
              <button onclick="setOrderStatus('${order.id}', 'listo')" class="btn-status ${estado === 'listo' ? 'active-listo' : ''}">
                <span>Listo</span>
              </button>
              <button onclick="setOrderStatus('${order.id}', 'entregado')" class="btn-status ${estado === 'entregado' ? 'active-entregado' : ''}" style="grid-column: span 2;">
                <span>Entregado</span>
              </button>
              <button onclick="setOrderStatus('${order.id}', 'cancelado')" class="btn-status btn-cancel" style="grid-column: span 1;">
                <span>Cancelar</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function setOrderStatus(orderId, nuevoEstado) {
      const isStatic = window.location.protocol === 'file:' || 
                       window.location.hostname.endsWith('github.io') || 
                       window.location.pathname.endsWith('.html');

      if (isStatic || !window.location.port) {
        const ord = ordersList.find(o => o.id === orderId);
        if (ord) ord.estado = nuevoEstado;
        renderOrders();

        try {
          let local = JSON.parse(localStorage.getItem('fogon_orders') || '[]');
          const target = local.find(o => o.id === orderId);
          if (target) {
            target.estado = nuevoEstado;
            localStorage.setItem('fogon_orders', JSON.stringify(local));
          }
        } catch (_) {}

        if (window.supabaseClient) {
          try {
            await window.supabaseClient.from('pedidos').update({ estado: nuevoEstado }).eq('id', orderId);
          } catch (_) {}
        }

        showToast(`Comanda #${ord ? ord.numero_comanda : ''} actualizada a '${nuevoEstado}'.`);
        return;
      }

      try {
        const res = await fetch(`/api/admin/orders/${orderId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nuevoEstado })
        });
        if (!res.ok) throw new Error('Error al actualizar estado');
        const ord = ordersList.find(o => o.id === orderId);
        if (ord) ord.estado = nuevoEstado;
        renderOrders();
        showToast(`Comanda #${ord ? ord.numero_comanda : ''} actualizada a '${nuevoEstado}'.`);
      } catch (err) {
        showToast('Error al actualizar comanda: ' + err.message, 'error');
      }
    }

    async function confirmDeleteOrder(orderId, orderNum) {
      if (!confirm(`¿Estás seguro de que quieres borrar la comanda #${orderNum}? Esta acción no se puede deshacer.`)) {
        return;
      }

      const isStatic = window.location.protocol === 'file:' || 
                       window.location.hostname.endsWith('github.io') || 
                       window.location.pathname.endsWith('.html');

      if (isStatic || !window.location.port) {
        ordersList = ordersList.filter(o => o.id !== orderId);
        renderOrders();

        try {
          let local = JSON.parse(localStorage.getItem('fogon_orders') || '[]');
          local = local.filter(o => o.id !== orderId);
          localStorage.setItem('fogon_orders', JSON.stringify(local));
        } catch (_) {}

        if (window.supabaseClient) {
          try {
            await window.supabaseClient.from('lineas_de_pedido').delete().eq('pedido_id', orderId);
            await window.supabaseClient.from('pedidos').delete().eq('id', orderId);
          } catch (_) {}
        }

        showToast(`Comanda #${orderNum} borrada correctamente`);
        return;
      }

      try {
        const res = await fetch(`/api/admin/orders/${orderId}`, { method: 'DELETE' });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'Error al borrar comanda');
        }
        ordersList = ordersList.filter(o => o.id !== orderId);
        renderOrders();
        showToast(`Comanda #${orderNum} borrada correctamente`);
      } catch (err) {
        showToast('Error al borrar comanda: ' + err.message, 'error');
      }
    }

    async function confirmClearCompleted() {
      const completedCount = ordersList.filter(o => o.estado === 'entregado' || o.estado === 'cancelado').length;
      if (completedCount === 0) {
        showToast('No hay comandas entregadas o canceladas para limpiar.', 'info');
        return;
      }
      if (!confirm(`¿Deseas eliminar las ${completedCount} comandas entregadas o canceladas?`)) {
        return;
      }

      const isStatic = window.location.protocol === 'file:' || 
                       window.location.hostname.endsWith('github.io') || 
                       window.location.pathname.endsWith('.html');

      if (isStatic || !window.location.port) {
        ordersList = ordersList.filter(o => o.estado !== 'entregado' && o.estado !== 'cancelado');
        renderOrders();

        try {
          let local = JSON.parse(localStorage.getItem('fogon_orders') || '[]');
          local = local.filter(o => o.estado !== 'entregado' && o.estado !== 'cancelado');
          localStorage.setItem('fogon_orders', JSON.stringify(local));
        } catch (_) {}

        if (window.supabaseClient) {
          try {
            await window.supabaseClient.from('pedidos').delete().in('estado', ['entregado', 'cancelado']).eq('restaurante_id', REST_ID);
          } catch (_) {}
        }

        showToast(`${completedCount} comandas finalizadas eliminadas`);
        return;
      }

      try {
        const res = await fetch('/api/admin/orders/clear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filter: 'completed' })
        });
        if (!res.ok) throw new Error('Error al limpiar comandas');
        await loadOrders();
        showToast(`${completedCount} comandas finalizadas eliminadas`);
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    async function confirmClearAll() {
      if (ordersList.length === 0) {
        showToast('No hay comandas para borrar.', 'info');
        return;
      }
      if (!confirm(`¿Estás seguro de que deseas BORRAR TODAS las ${ordersList.length} comandas del panel?`)) {
        return;
      }

      const isStatic = window.location.protocol === 'file:' || 
                       window.location.hostname.endsWith('github.io') || 
                       window.location.pathname.endsWith('.html');

      if (isStatic || !window.location.port) {
        ordersList = [];
        renderOrders();
        try {
          localStorage.removeItem('fogon_orders');
        } catch (_) {}

        if (window.supabaseClient) {
          try {
            await window.supabaseClient.from('lineas_de_pedido').delete().eq('restaurante_id', REST_ID);
            await window.supabaseClient.from('pedidos').delete().eq('restaurante_id', REST_ID);
          } catch (_) {}
        }

        showToast('Todas las comandas han sido eliminadas');
        return;
      }

      try {
        const res = await fetch('/api/admin/orders/clear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filter: 'all' })
        });
        if (!res.ok) throw new Error('Error al vaciar comandas');
        ordersList = [];
        renderOrders();
        showToast('Todas las comandas han sido eliminadas');
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    // Suscripción Realtime en Supabase y eventos de storage local
    function initLiveSync() {
      if (window.supabaseClient) {
        try {
          window.supabaseClient
            .channel('kds-orders-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
              loadOrders();
            })
            .subscribe();
        } catch (_) {}
      }

      // Sincronización entre pestañas en el mismo navegador
      window.addEventListener('storage', (e) => {
        if (e.key === 'fogon_orders') {
          loadOrders();
        }
      });

      // EventSource si corre con backend Node
      if (window.location.port) {
        try {
          const evtSource = new EventSource('/api/events');
          evtSource.onmessage = (e) => {
            loadOrders();
          };
        } catch (_) {}
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrders();
      initLiveSync();
      // Polling de respaldo cada 5 segundos
      setInterval(loadOrders, 5000);
    });
  </script>

</body>

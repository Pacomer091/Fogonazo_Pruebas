<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante no disponible — Fogonazo</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-icon {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-lg);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <div class="error-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>
    <h1 style="font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 800; margin-bottom: 0.5rem;">Restaurante no disponible</h1>
    <p style="color: var(--text-muted); max-width: 480px; margin-bottom: 2rem; font-size: clamp(0.9rem, 3.5vw, 1rem);">
      El subdominio solicitado no corresponde a ningún restaurante activo en la red Fogonazo o el servicio se encuentra temporalmente pausado.
    </p>
    <a href="http://localhost:8080/" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 8px;">
      <span>Volver a la portada de Fogonazo</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </a>
  </div>
</body>
</html>
